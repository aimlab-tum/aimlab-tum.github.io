# Builds the Hugo site and deploys it to GitHub Pages.
#
# Nothing generated is ever committed: the built site is uploaded as a Pages
# artifact straight from the runner. To publish a change, push to main.
#
# Requires: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild twice a day so the Bluesky feed on the News section stays current
  # even when nobody pushes.
  schedule:
    - cron: '17 6,18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENV: production
    steps:
      # Shallow clone is fine: enableGitInfo is false in config/_default/config.toml.
      - uses: actions/checkout@v4

      # Hugo Modules resolve the Wowchemy theme through the Go toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            resources/_gen
          key: hugo-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: hugo-${{ runner.os }}-

      # Pinned to the versions the live site was built with. Wowchemy compiles
      # SCSS, so the extended build is required.
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.74.3'
          extended: true

      # enablement: true turns Pages on with the "GitHub Actions" source if it
      # has never been configured, so no manual setup is needed for a new repo.
      # Refresh the Bluesky feed into data/bluesky.json before building, so the
      # posts are baked into the HTML and no visitor's browser contacts Bluesky.
      # The script keeps the committed copy if the API is unreachable, so an
      # outage cannot fail a deploy.
      - name: Refresh the Bluesky feed
        run: python3 .github/scripts/fetch_bluesky.py

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      # The repository is the source of truth for the public address: when
      # static/CNAME claims a custom domain, build against that. Otherwise fall
      # back to whatever Pages reports, which covers *.github.io hosts and
      # project subpaths.
      #
      # Without this the two drift silently. During the aim-lab.io cutover the
      # Pages setting said www.aim-lab.io while static/CNAME said aim-lab.io, so
      # every generated URL - canonical tags, sitemap, RSS - pointed at a host
      # that only redirects.
      - name: Determine base URL
        id: base
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          if [ -s static/CNAME ]; then
            domain=$(tr -d '[:space:]' < static/CNAME)
            url="https://${domain}/"
            echo "static/CNAME claims ${domain}, building against ${url}"
          else
            url="${PAGES_URL}/"
            echo "no static/CNAME, building against the Pages URL ${url}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: hugo --gc --minify -b "${{ steps.base.outputs.url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
